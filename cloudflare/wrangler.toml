# PLANET-only remote alerts for smartPC. Deployed by .github/workflows/cloudflare.yml with the shop's own
# Cloudflare account (secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID). The database id is filled in by the workflow.
name = "smartdisk-remote"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "smartdisk-remote"
database_id = "__D1_ID__"
