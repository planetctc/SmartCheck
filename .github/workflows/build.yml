name: Build Windows installer

# - Pull requests / pushes to main: build the installer and keep it as an Actions artifact.
# - Publish a release to planetctc/smartCheck-releases (installed copies pick it up as an online update):
#   Actions -> "Build Windows installer" -> Run workflow -> tick "publish", or push a tag like v0.3.0.
#   Needs the repository secret RELEASES_TOKEN (a token that can write to smartCheck-releases).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "发布新版本到 smartCheck-releases（自动更新）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }
      - name: Build
        if: env.PUBLISH != 'true'
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build and publish release
        if: env.PUBLISH == 'true'
        run: npm run release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: smartCheck-Setup
          path: dist/smartCheck-Setup-*.exe
