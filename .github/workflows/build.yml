name: Build Windows installer

# - Pull requests / pushes to main: build the installer and keep it as an Actions artifact.
# - Publish a release to planetctc/smartCheck-releases (installed copies pick it up as an online update):
#   Actions -> "Build Windows installer" -> Run workflow -> tick "publish", or push a tag like v0.3.0.
#   Needs the repository secret RELEASES_TOKEN (a token that can write to smartCheck-releases).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "发布新版本到 smartCheck-releases（自动更新）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }
      - name: Build helper, DiskSpd and sensors
        run: |
          npm run build:helper
          npm run build:diskspd
          npm run build:sensors
      # Code signing with PLANET's own certificate (optional). Repository secrets, set by the shop owner:
      #   CODESIGN_PFX       the .pfx file as base64 (one line)
      #   CODESIGN_PASSWORD  the .pfx password
      # Without them the build is unsigned, as before.
      - name: Sign helper programs
        shell: pwsh
        env:
          PFX: ${{ secrets.CODESIGN_PFX }}
          PFX_PW: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if (-not $env:PFX) { Write-Host "CODESIGN_PFX not set: building unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX.Trim()))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $files = @('helper/build/Release/smartdisk-helper.exe', 'third_party/diskspd/diskspd_vs/x64/Release/diskspd.exe') + (Get-ChildItem sensors/out -Filter smartdisk-*.exe | ForEach-Object FullName)
          foreach ($f in $files) {
            & $st.FullName sign /f $pfx /p $env:PFX_PW /fd sha256 /tr http://timestamp.digicert.com /td sha256 $f
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $f" }
          }
          # electron-builder signs smartCheck.exe, the installer and the uninstaller with the same certificate.
          "CSC_LINK=$pfx" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:PFX_PW" >> $env:GITHUB_ENV
      - name: Build
        if: env.PUBLISH != 'true'
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build and publish release
        if: env.PUBLISH == 'true'
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: smartCheck-Setup
          path: dist/smartCheck-Setup-*.exe
