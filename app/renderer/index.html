<!doctype html>
<html lang="zh-CN" data-theme="slate">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>SmartDisk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"/><circle cx="12" cy="12" r="3.2"/></svg>
      <div><div class="name">SmartDisk</div><div class="sub">硬盘健康检测</div></div>
    </div>
    <div class="side-title">硬盘</div>
    <nav id="diskList" class="disk-list"></nav>
    <div class="side-foot">
      <button id="refresh" class="primary">重新检测</button>
      <label class="theme-pick">皮肤
        <select id="theme">
          <option value="slate">石墨</option>
          <option value="light">明亮</option>
          <option value="ocean">海蓝</option>
          <option value="forest">森林</option>
          <option value="sunset">落日</option>
        </select>
      </label>
      <div id="scanTime" class="muted small"></div>
      <div id="notice" class="notice small"></div>
    </div>
  </aside>

  <main id="detail" class="detail">
    <p class="muted">正在读取硬盘信息…</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
